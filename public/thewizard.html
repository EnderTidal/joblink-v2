<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobLink &mdash; The Wizard</title>
<script>(function(){if(localStorage.getItem("joblink_light_mode")!=="false"){document.documentElement.classList.add("light-mode")}})();</script>
<link rel="stylesheet" href="/app.css?v=5">
<style>
  .paths { justify-content: center; display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .paths button { display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;padding:18px 18px 18px 22px;border:1px solid var(--border);background:var(--surface); border-radius:var(--radius); cursor:pointer;
    font-size:.95rem; font-weight:600; color:var(--text); transition:border-color .15s, background .15s, box-shadow .15s; border-left:4px solid transparent; position:relative; }
  .paths button:hover { border-color:var(--brand); box-shadow:0 2px 8px rgba(0,0,0,0.15); }
  .paths button.on { border-color:var(--brand); background:var(--brand-soft); }
  .paths button[data-path="job_order"] { border-left-color:#3b82f6; }
  .paths button[data-path="blast"] { border-left-color:#22c55e; }
  .paths button[data-path="review"] { border-left-color:#a855f7; }
  .paths button[data-path="help"] { border-left-color:var(--text-muted); background:var(--surface-2); opacity:0.85; }
  .paths button[data-path="help"]:hover { opacity:1; }
  .paths.wizard-active { display:none; }
  @media(max-width:600px) { .paths { grid-template-columns:1fr; } .paths button { padding:16px 16px 16px 20px; } }
  #chat { display:flex; flex-direction:column; gap:10px; min-height:120px; }
  /* Hide chat entirely when wizard flow is active (blast, JO, review) — only show for help */
  .card.hide-chat #chat,
  .card.hide-chat #composer { display:none !important; }
  .msg { max-width:78%; padding:12px 15px; border-radius:14px; white-space:pre-wrap; font-size:.94rem; line-height:1.45; }
  .msg.tom { background:var(--surface-2); border:1px solid var(--border); align-self:flex-start; border-bottom-left-radius:4px; }
  .msg.me { background:var(--brand); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .msg .choices { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  #composer { display:flex; gap:8px; margin-top:14px; }
  #composer textarea { flex:1; resize:vertical; min-height:46px; max-height:160px; }
  .hint { text-align:center; margin:40px 0; color:var(--text-muted); }

  /* Full-width JO form panel (replaces chat after AI parse) */
  #jo-form-panel { display:none; }
  #jo-form-panel.active { display:block; }
  #jo-form-panel .jo-form { display:flex; flex-direction:column; gap:12px; }
  #jo-form-panel .jo-field { display:flex; flex-direction:column; gap:3px; }
  #jo-form-panel label { font-size:.82rem; color:var(--text-muted); font-weight:600; }
  #jo-form-panel label .vis { font-weight:400; font-style:italic; font-size:.75rem; }
  #jo-form-panel input, #jo-form-panel textarea, #jo-form-panel select { background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:8px 10px; border-radius:6px; font-size:.9rem; font-family:inherit; }
  #jo-form-panel textarea { min-height:70px; resize:vertical; }
  #jo-form-panel input:focus, #jo-form-panel textarea:focus, #jo-form-panel select:focus { border-color:var(--brand); outline:none; }
  #jo-form-panel .form-actions { display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; }
  #jo-form-panel .form-warn { color:var(--amber); font-size:.82rem; margin-top:4px; }
  #jo-form-panel .form-title { font-size:1.05rem; font-weight:700; margin-bottom:4px; }

  /* Blast settings form panel */
  #blast-form-panel { display:none; }
  #blast-form-panel.active { display:block; }
  .bf-title { font-size:1.05rem; font-weight:700; margin-bottom:4px; }
  .bf-stat { font-size:.88rem; color:var(--text-muted); margin-bottom:12px; }
  .bf-stat strong { color:var(--text); }
  .bf-form { display:flex; flex-direction:column; gap:14px; }
  .bf-field { display:flex; flex-direction:column; gap:4px; }
  .bf-field label { font-size:.82rem; color:var(--text-muted); font-weight:600; }
  .bf-field input, .bf-field textarea, .bf-field select { background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:8px 10px; border-radius:6px; font-size:.9rem; font-family:inherit; }
  .bf-field textarea { min-height:90px; resize:vertical; }
  .bf-field input:focus, .bf-field textarea:focus, .bf-field select:focus { border-color:var(--brand); outline:none; }
  .bf-radio-group { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .bf-radio-group label { font-size:.88rem; color:var(--text); font-weight:400; cursor:pointer; display:flex; align-items:center; gap:4px; }
  .bf-radio-group input[type="radio"] { width:auto; margin:0; }
  .bf-radio-group input[type="number"] { width:80px; padding:6px 8px; }
  .bf-btn-group { display:flex; gap:6px; flex-wrap:wrap; }
  .bf-btn-group button { padding:8px 16px; border:1px solid var(--border); background:var(--surface); border-radius:8px; cursor:pointer;
    font-size:.88rem; font-weight:600; color:var(--text); transition:border-color .15s, background .15s; }
  .bf-btn-group button:hover { border-color:var(--brand); }
  .bf-btn-group button.selected { border-color:var(--brand); background:var(--brand-soft); color:var(--brand); }
  .bf-preview-box { background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px 12px;
    font-size:.85rem; color:var(--text-muted); white-space:pre-wrap; line-height:1.4; margin-top:4px; }
  .bf-save-link { display:inline-block; margin-top:4px; color:var(--brand); cursor:pointer; font-size:.82rem; text-decoration:underline; }
  .bf-save-link:hover { color:var(--brand); }
  .bf-actions { display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; }
  .bf-warn { color:var(--amber); font-size:.82rem; margin-top:4px; }

  /* Blast review cards */
  .blast-card { background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px 12px;
    margin-top:6px; cursor:pointer; transition:border-color .15s; }
  .blast-card:hover { border-color:var(--brand); }
  .blast-card .bc-header { font-weight:600; font-size:.9rem; }
  .blast-card .bc-meta { font-size:.8rem; color:var(--text-muted); margin-top:2px; }
  .blast-recipients { margin-top:8px; font-size:.85rem; }
  .blast-recipients table { width:100%; border-collapse:collapse; margin-top:4px; }
  .blast-recipients th, .blast-recipients td { text-align:left; padding:3px 6px; border-bottom:1px solid var(--border); font-size:.82rem; }
  .blast-recipients th { color:var(--text-muted); font-weight:600; }
  .blast-recipients .csv-link { display:inline-block; margin-top:6px; color:var(--brand); text-decoration:underline; cursor:pointer; font-size:.82rem; }


  .sms-credit-counter { margin-top:6px; font-size:.82rem; font-weight:500; padding:6px 10px; border-radius:6px; background:var(--surface-2); border:1px solid var(--border); }
  .sms-credit-counter.credit-green { color:#22c55e; border-color:#22c55e40; }
  .sms-credit-counter.credit-yellow { color:#eab308; border-color:#eab30840; }
  .sms-credit-counter.credit-red { color:#ef4444; border-color:#ef444440; }

  /* Expandable recipient list */
  .recipient-toggle { background:none; border:1px solid var(--border); color:var(--brand); padding:6px 10px;
    border-radius:6px; cursor:pointer; font-size:.82rem; margin-top:8px; }
  .recipient-toggle:hover { border-color:var(--brand); }
  .recipient-list { margin-top:6px; font-size:.82rem; max-height:300px; overflow-y:auto; }
  .recipient-list .rl-row { padding:2px 0; border-bottom:1px solid var(--border); }

  .loading-indicator { display:flex; align-items:center; gap:8px; padding:12px 16px; color:var(--text-subtle); font-size:.9rem; }
  .loading-indicator .dots { display:inline-flex; gap:4px; }
  .loading-indicator .dots span { width:8px; height:8px; border-radius:50%; background:var(--brand); animation:bounce 1.4s infinite ease-in-out both; }
  .loading-indicator .dots span:nth-child(1) { animation-delay:-0.32s; }
  .loading-indicator .dots span:nth-child(2) { animation-delay:-0.16s; }
  @keyframes bounce { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }

  /* Drag-and-drop overlay */
  .drop-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6);
    z-index:9999; align-items:center; justify-content:center; flex-direction:column; backdrop-filter:blur(2px); transition:opacity .15s; }
  .drop-overlay.active { display:flex; }
  .drop-overlay-box { background:var(--surface); border:3px dashed var(--brand); border-radius:20px; padding:48px 64px;
    text-align:center; box-shadow:0 8px 32px rgba(0,0,0,0.4); transition:transform .15s; }
  .drop-overlay.active .drop-overlay-box { animation:dropPulse .3s ease; }
  @keyframes dropPulse { 0%{transform:scale(.95);opacity:.7} 100%{transform:scale(1);opacity:1} }
  .drop-overlay-icon { margin-bottom:16px; color:var(--brand); }
  .drop-overlay-title { font-size:18px; font-weight:700; color:var(--brand); }
  .drop-overlay-sub { font-size:14px; color:var(--text-subtle); margin-top:6px; }

  /* Blank form link */
  .blank-form-link { display:inline-block; margin-top:8px; color:var(--brand); cursor:pointer; font-size:.9rem; text-decoration:none; font-weight:600; background:transparent; border:1.5px solid var(--brand); border-radius:8px; padding:10px 20px; transition:background .15s,color .15s; width:100%; }
  .blank-form-link:hover { background:var(--brand); color:#fff; border-color:var(--brand); }

  /* Save template modal */
  .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6);
    z-index:9998; align-items:center; justify-content:center; }
  .modal-overlay.active { display:flex; }
  .modal-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; min-width:340px; max-width:440px; }
  .modal-box h3 { margin:0 0 12px 0; font-size:1rem; }
  .modal-box .bf-field { margin-bottom:10px; }
  .modal-box .bf-actions { margin-top:14px; }

  
  .silly-phrase { font-style:italic; color:var(--text-muted); font-size:.82rem; margin-top:4px; opacity:0; transition:opacity .3s; }
  .silly-phrase.visible { opacity:1; }


  /* Contact form panel for blast entry */
  #contact-form-panel { display:none; }
  #contact-form-panel.active { display:block; }
  #contact-form-panel .cf-title { font-size:1.05rem; font-weight:700; margin-bottom:4px; }
  #contact-form-panel .cf-hint { color:var(--text-muted); font-size:13px; margin-bottom:12px; }
  .contact-row { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .contact-row input { flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:8px 10px; border-radius:6px; font-size:.9rem; font-family:inherit; }
  .contact-row input:focus { border-color:var(--brand); outline:none; }
  .contact-row input::placeholder { color:var(--text-subtle); }
  .contact-row .remove-row { padding:4px 10px; background:none; border:1px solid var(--border); color:var(--text-muted);
    border-radius:6px; cursor:pointer; font-size:16px; line-height:1; transition:border-color .15s, color .15s; flex-shrink:0; }
  .contact-row .remove-row:hover { border-color:#ef4444; color:#ef4444; }
  #contact-form-panel .cf-actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:center; }
  #contact-form-panel .cf-or { color:var(--text-muted); font-size:13px; margin-top:8px; }

  /* Help topic buttons */
  .help-topics { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .help-topics button { padding:10px 16px; border:1px solid var(--border); background:var(--surface);
    border-radius:8px; cursor:pointer; font-size:.88rem; font-weight:500; color:var(--text);
    transition:border-color .15s, background .15s; text-align:left; }
  .help-topics button:hover { border-color:var(--brand); background:var(--brand-soft); }


  /* Unified JO entry panel */
  #jo-entry-panel { display:none; }
  #jo-entry-panel.active { display:block; }
  .jo-entry-title { font-size:1.05rem; font-weight:700; margin-bottom:14px; }
  .jo-entry-options { display:flex; flex-direction:column; gap:16px; }
  .jo-entry-option { background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:16px 18px; }
  .jo-entry-option-label { font-size:.9rem; font-weight:600; color:var(--text); margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  .jo-entry-option-label .icon { font-size:1.1rem; }
  .jo-entry-paste textarea { width:100%; min-height:160px; resize:vertical; background:var(--surface); border:1px solid var(--border);
    color:var(--text); padding:10px 12px; border-radius:8px; font-size:.88rem; font-family:inherit; line-height:1.5; box-sizing:border-box; margin-bottom:8px; }
  .jo-entry-paste textarea:focus { border-color:var(--brand); outline:none; }
  .jo-entry-paste textarea::placeholder { color:var(--text-subtle); }
  .jo-entry-paste .paste-hint { color:var(--text-muted); font-size:.78rem; margin-bottom:8px; line-height:1.3; }
  .jo-entry-upload-btn { width:100%; padding:12px; font-size:.92rem; cursor:pointer; }
  .jo-entry-upload-hint { color:var(--text-muted); font-size:.78rem; margin-top:6px; }
  .jo-entry-blank { display:inline-block; color:var(--brand); cursor:pointer; font-size:.9rem; text-decoration:none; font-weight:600; background:transparent; border:1.5px solid var(--brand); border-radius:8px; padding:10px 20px; transition:background .15s,color .15s; }
  .jo-entry-blank:hover { background:var(--brand); color:#fff; border-color:var(--brand); }
  .jo-entry-divider { display:flex; align-items:center; gap:12px; color:var(--text-muted); font-size:.78rem; }
  .jo-entry-divider::before, .jo-entry-divider::after { content:''; flex:1; height:1px; background:var(--border); }

  /* Paste panel */
  #paste-panel { display:none; }
  #paste-panel.active { display:block; }
  #paste-panel textarea { width:100%; min-height:220px; resize:vertical; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); padding:12px 14px; border-radius:8px; font-size:.9rem; font-family:inherit; line-height:1.5; box-sizing:border-box; }
  #paste-panel textarea:focus { border-color:var(--brand); outline:none; }
  #paste-panel textarea::placeholder { color:var(--text-subtle); }
  #paste-panel .paste-hint { color:var(--text-muted); font-size:.82rem; margin-bottom:10px; line-height:1.4; }
  #paste-panel .paste-actions { display:flex; gap:10px; margin-top:12px; align-items:center; }
  #paste-panel .paste-example { color:var(--text-subtle); font-size:.78rem; margin-top:10px; line-height:1.4; font-style:italic; }

  /* Tom light mode */


  /* Column mapping panel */
  #column-map-panel { display:none; }
  #column-map-panel.active { display:block; }
  .cm-title { font-size:1.05rem; font-weight:700; margin-bottom:4px; }
  .cm-hint { color:var(--text-muted); font-size:13px; margin-bottom:16px; }
  .cm-table { width:100%; border-collapse:collapse; margin-bottom:16px; }
  .cm-table th { text-align:left; padding:8px 10px; font-size:.82rem; color:var(--text-muted); font-weight:600; border-bottom:1px solid var(--border); }
  .cm-table td { padding:6px 10px; border-bottom:1px solid var(--border); font-size:.88rem; }
  .cm-table .cm-header-name { font-weight:600; color:var(--text); }
  .cm-table .cm-sample { color:var(--text-muted); font-size:.82rem; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cm-table select { background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:6px 8px; border-radius:6px; font-size:.85rem; font-family:inherit; min-width:140px; }
  .cm-table select:focus { border-color:var(--brand); outline:none; }
  .cm-actions { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  /* Column mapper: auto-detect summary card */
  .cm-summary-card { background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:20px 24px; margin-bottom:16px; }
  .cm-summary-count { font-size:1.1rem; margin:12px 0 16px; color:var(--green, #22c55e); }
  .cm-summary-count strong { font-weight:700; }
  .cm-summary-fields { display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
  .cm-summary-field { font-size:.92rem; color:var(--text); line-height:1.5; }
  .cm-summary-field .cm-field-label { font-weight:600; color:var(--text); }
  .cm-summary-field .cm-sample-preview { color:var(--text-muted); font-size:.85rem; font-style:italic; }
  .cm-summary-field .cm-field-warn { color:#f59e0b; margin-right:4px; }
  .cm-optional { color:var(--text-muted); font-size:.82rem; }
  /* Column mapper: manual mapper fields */
  .cm-field-group { margin-bottom:18px; }
  .cm-field-group > label.cm-field-label,
  .cm-field-group > .cm-field-label { display:block; font-weight:600; font-size:.92rem; margin-bottom:6px; color:var(--text); }
  .cm-field-group select.cm-select { display:block; width:100%; max-width:360px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:8px; font-size:.9rem; font-family:inherit; margin-top:4px; }
  .cm-field-group select.cm-select:focus { border-color:var(--brand); outline:none; }
  .cm-format-group { margin-top:10px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .cm-format-group .cm-field-label { font-weight:600; font-size:.88rem; }
  .cm-radio-label { display:inline-flex; align-items:center; gap:4px; font-size:.88rem; cursor:pointer; color:var(--text); }
  .cm-radio-label input[type="radio"] { accent-color:var(--brand); }
  .cm-separate-group { display:flex; gap:12px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  .cm-separate-group label { font-size:.88rem; font-weight:500; color:var(--text); }
  .cm-separate-group select { background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:6px 8px; border-radius:6px; font-size:.85rem; font-family:inherit; min-width:140px; }

  /* Step indicator */
  .step-indicator { font-size:.82rem; color:var(--text-muted); margin-bottom:12px; font-weight:500; }
  .step-indicator strong { color:var(--brand); }
  .back-btn { background:none; border:none; color:var(--brand); cursor:pointer; font-size:.88rem; font-weight:500; padding:0; margin-bottom:8px; display:inline-flex; align-items:center; gap:4px; }
  .back-btn:hover { text-decoration:underline; }

  /* Exclusion upload panel */
  #exclusion-panel { display:none; }
  #exclusion-panel.active { display:block; }
  .ex-title { font-size:1.05rem; font-weight:700; margin-bottom:4px; }
  .ex-stat { font-size:.88rem; color:var(--text-muted); margin-bottom:16px; }
  .ex-stat strong { color:var(--text); }
  .ex-hint { color:var(--text-muted); font-size:13px; margin-bottom:16px; }
  .ex-actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .ex-result { background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:12px 16px; margin-top:12px; font-size:.9rem; }

  /* Button hierarchy improvements */
  .btn.text-link { background:none; border:none; color:var(--text-muted); font-size:.82rem; font-weight:500; padding:8px 4px; cursor:pointer; text-decoration:underline; }
  .btn.text-link:hover { color:var(--text); }
  .cm-actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:center; }
  .cm-actions .btn.ghost { border-color:var(--border); color:var(--text-muted); font-size:.88rem; }
  .cm-actions .btn.ghost:hover { border-color:var(--brand); color:var(--text); }
  .ex-actions .btn.ghost { border-color:var(--border); color:var(--text-muted); }

  /* Blast form sections */
  .bf-section { background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-bottom:14px; }
  .bf-section-title { font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); margin-bottom:12px; padding-bottom:6px; border-bottom:1px solid var(--border); }

  /* Dark mode contrast improvements */
  :root:not(.light-mode) .paths button { border-top-color:rgba(255,255,255,0.12); border-right-color:rgba(255,255,255,0.12); border-bottom-color:rgba(255,255,255,0.12); }
  :root:not(.light-mode) .cm-summary-card { border-color:rgba(255,255,255,0.15); }
  :root:not(.light-mode) .card { border-color:rgba(255,255,255,0.1); }
  :root:not(.light-mode) .contact-row .remove-row { color:var(--text-subtle); border-color:rgba(255,255,255,0.15); }
  :root:not(.light-mode) .bf-field label { color:var(--text); opacity:0.7; }
  :root:not(.light-mode) input::placeholder, :root:not(.light-mode) textarea::placeholder { opacity:0.5; }

  /* Mobile nav improvements */
  @media(max-width:480px) {
    nav.topbar .nav-links { gap:2px; }
    nav.topbar .nav-links a { padding:6px 8px; font-size:12px; }
    nav.topbar #whoami { display:none; }
    nav.topbar button { padding:6px 8px; font-size:12px; }
  }
</style></head>
<body>
<main class="page">
  <h1 class="pagetitle">The Wizard</h1><p class="mut" style="margin:0 0 24px">Pick a task to start — each conversation handles one job at a time.</p>

function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}


function dismissNudge(el) { el.style.transition='opacity .2s'; el.style.opacity='0'; setTimeout(function(){ el.remove(); }, 200); }

function showLoading() {
  var chat = document.getElementById('chat');
  var el = document.createElement('div');
  el.className = 'msg tom loading-indicator';
  el.id = 'loading-msg';
  if (blastProgressMode) {
    var idx = Math.floor(Math.random() * BLAST_PROGRESS_MESSAGES.length);
    el.innerHTML = '<span class="dots"><span></span><span></span><span></span></span> ' + BLAST_PROGRESS_MESSAGES[idx];
    blastProgressInterval = setInterval(function() {
      var msgEl = document.getElementById('loading-msg');
      if (!msgEl) { clearInterval(blastProgressInterval); blastProgressInterval = null; return; }
      idx = (idx + 1) % BLAST_PROGRESS_MESSAGES.length;
      msgEl.innerHTML = '<span class="dots"><span></span><span></span><span></span></span> ' + BLAST_PROGRESS_MESSAGES[idx];
    }, 3000);
  } else {
    el.innerHTML = '<span class="dots"><span></span><span></span><span></span></span> Working...<div class="silly-phrase" id="silly-phrase"></div>';
    sillyPhraseTimeout = setTimeout(function() {
      var shuffled = shuffleArray(SILLY_PHRASES);
      var idx = 0;
      var sp = document.getElementById('silly-phrase');
      if (sp) { sp.textContent = shuffled[idx]; sp.classList.add('visible'); }
      sillyPhraseInterval = setInterval(function() {
        idx = (idx + 1) % shuffled.length;
        var sp2 = document.getElementById('silly-phrase');
        if (!sp2) { clearInterval(sillyPhraseInterval); sillyPhraseInterval = null; return; }
        sp2.style.opacity = '0';
        setTimeout(function() {
          if (sp2) { sp2.textContent = shuffled[idx]; sp2.style.opacity = '1'; }
        }, 200);
      }, 5000);
    }, 5000);
  }
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}
function hideLoading() {
  var el = document.getElementById('loading-msg');
  if (el) el.remove();
  if (blastProgressInterval) { clearInterval(blastProgressInterval); blastProgressInterval = null; }
  blastProgressMode = false;
  if (sillyPhraseTimeout) { clearTimeout(sillyPhraseTimeout); sillyPhraseTimeout = null; }
  if (sillyPhraseInterval) { clearInterval(sillyPhraseInterval); sillyPhraseInterval = null; }
}

function md(s) {
  if (!s) return '';
  return s
    .replace(/^### (.+)/gm, '<h4>$1</h4>')
    .replace(/^## (.+)/gm, '<h3>$1</h3>')
    .replace(/^# (.+)/gm, '<h2>$1</h2>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^- (.+)/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')
    .replace(/\n/g, '<br>');
}

// ---- Full-width JO Form ----
function showJOForm(draft, warnings) {
  joFormActive = true;
  hideJOModeTabs();
  var panel = document.getElementById('jo-form-panel');
  panel.className = 'active';
  panel.innerHTML = '';
  document.getElementById('chat').style.display = 'none';
  document.getElementById('blast-form-panel').className = '';

  var title = document.createElement('div');
  title.className = 'form-title';
  title.textContent = draft.title ? 'Edit Job Order' : 'New Job Order';
  panel.appendChild(title);

  if (warnings && warnings.length) {
    var warn = document.createElement('div');
    warn.className = 'form-warn';
    warn.textContent = 'Notes: ' + warnings.join('; ');
    panel.appendChild(warn);
  }

  var form = document.createElement('div');
  form.className = 'jo-form';
  form.id = 'jo-edit-form';

  JO_FIELDS.forEach(function(f) {
    var wrap = document.createElement('div');
    wrap.className = 'jo-field';
    var label = document.createElement('label');
    var vis = FIELD_VISIBILITY[f.key] || '';
    label.innerHTML = esc(f.label) + (f.required ? ' *' : '') + (vis ? ' <span class="vis">' + esc(vis) + '</span>' : '');
    wrap.appendChild(label);

    var input;
    if (f.key === 'category') {
      input = document.createElement('select');
      var emptyOpt = document.createElement('option');
      emptyOpt.value = ''; emptyOpt.textContent = '\u2014 Select \u2014';
      input.appendChild(emptyOpt);
      CATEGORIES.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        if (draft[f.key] === c) opt.selected = true;
        input.appendChild(opt);
      });
    } else if (f.key === 'description' || f.key === 'requirements') {
      input = document.createElement('textarea');
      input.value = draft[f.key] || '';
    } else {
      input = document.createElement('input');
      input.type = 'text';
      input.value = draft[f.key] || '';
    }
    input.dataset.field = f.key;
    wrap.appendChild(input);
    form.appendChild(wrap);
  });

  panel.appendChild(form);

  // Fix 4: Long description warning
  (function() {
    var descTA = form.querySelector('textarea[data-field="description"]');
    if (!descTA) return;
    var warnEl = document.createElement('div');
    warnEl.style.cssText = 'background:#FFF3CD;color:#856404;padding:8px 12px;border-radius:6px;font-size:13px;margin-top:6px;display:none;';
    warnEl.textContent = '⚠️ Shorter descriptions tend to get higher engagement. Consider trimming to the essentials.';
    descTA.parentNode.appendChild(warnEl);
    function checkLen() { warnEl.style.display = descTA.value.length > 500 ? 'block' : 'none'; }
    descTA.addEventListener('input', checkLen);
    checkLen();

  })();

  var actions = document.createElement('div');
  actions.className = 'form-actions';

  var pubBtn = document.createElement('button');
  pubBtn.className = 'btn gold';
  pubBtn.textContent = 'Publish';
  pubBtn.addEventListener('click', function() { submitJOForm('publish'); });

  var draftBtn = document.createElement('button');
  draftBtn.className = 'btn ghost';
  draftBtn.style.background = '#334155';
  draftBtn.style.color = '#94a3b8';
  draftBtn.textContent = 'Save as Draft';
  draftBtn.addEventListener('click', function() { submitJOForm('done'); });

  var startOverBtn = document.createElement('button');
  startOverBtn.className = 'btn ghost';
  startOverBtn.textContent = 'Start Over';
  startOverBtn.addEventListener('click', function() { hideJOForm(); sendAction('start_over', {}); });

  actions.appendChild(pubBtn);
  actions.appendChild(draftBtn);
  actions.appendChild(startOverBtn);
  panel.appendChild(actions);

  document.getElementById('input').placeholder = 'Edit fields directly in the form above, or click Start Over to re-parse.';
}

function hideJOForm() {
  joFormActive = false;
  var panel = document.getElementById('jo-form-panel');
  panel.className = '';
  panel.innerHTML = '';
  document.getElementById('chat').style.display = 'flex';
  document.getElementById('input').placeholder = 'Type here\u2026';
}

function getFormDraft() {
  var draft = {};
  var form = document.getElementById('jo-edit-form');
  if (!form) return draft;
  form.querySelectorAll('input, textarea, select').forEach(function(el) {
    if (el.dataset.field) draft[el.dataset.field] = el.value;
  });
  return draft;
}

async function submitJOForm(action) {
  var draft = getFormDraft();
  showLoading();
  var r = await api('/api/tom/message', { method: 'POST', body: { sessionId: session, action: action, payload: { draft: draft } } });
  hideLoading();
  if (r.showForm && r.draft) {
    showJOForm(r.draft, r.warnings || []);
    return;
  }
  if (r.error && r.state === 'review') {
    var panel = document.getElementById('jo-form-panel');
    var existing = panel.querySelector('.form-warn');
    if (existing) existing.remove();
    var warn = document.createElement('div');
    warn.className = 'form-warn';
    warn.textContent = r.text || r.error;
    var actionsEl = panel.querySelector('.form-actions');
    if (actionsEl) panel.insertBefore(warn, actionsEl);
    return;
  }
  hideJOForm();
  handleReply(r);
}

var columnMapData = null;

function showColumnMapPanel(data) {
  columnMapData = data;
  var panel = document.getElementById('column-map-panel');
  panel.className = 'active';
  panel.innerHTML = '';
  document.getElementById('chat').style.display = 'none';
  document.getElementById('jo-form-panel').className = '';

  var cmStep = document.createElement('div');
  cmStep.className = 'step-indicator';
  cmStep.innerHTML = 'Step <strong>2</strong> of 4: Verify Contacts';
  panel.appendChild(cmStep);

  var cmBackBtn = document.createElement('button');
  cmBackBtn.className = 'back-btn';
  cmBackBtn.innerHTML = '\u2190 Back';
  cmBackBtn.addEventListener('click', function() {
    hideColumnMapPanel();
    sendAction('back_to_upload', {});
  });
  panel.appendChild(cmBackBtn);

  // Build auto-detect summary from suggestedMap
  var suggested = data.suggestedMap || {};
  var headers = data.headers || [];
  var samples = data.sampleRows || [];

  // Find what was detected
  var nameCol = null, nameFormat = null, phoneCol = null, lastContactedCol = null;
  var firstCol = null, lastCol = null;
  var nameFormatLabel = { 'name_fl': 'First Last', 'name_lf': 'Last, First', 'first': 'First Name', 'last': 'Last Name' };

  Object.keys(suggested).forEach(function(idx) {
    var val = suggested[idx];
    var i = parseInt(idx);
    if (val === 'name_fl' || val === 'name_lf') {
      nameCol = i; nameFormat = val;
    } else if (val === 'first') {
      firstCol = i;
      if (nameCol === null) { nameCol = i; nameFormat = 'first'; }
    } else if (val === 'last') {
      lastCol = i;
    } else if (val === 'phone' && phoneCol === null) {
      phoneCol = i;
    } else if (val === 'lastContacted') {
      lastContactedCol = i;
    }
  });

  // If we have separate first+last columns, note that
  var hasSeparateCols = firstCol !== null && lastCol !== null && nameFormat === 'first';

  // Total data rows
  var totalRows = data.totalRows || samples.length;

  // Sample names for verification
  var sampleNames = [];
  if (hasSeparateCols) {
    samples.forEach(function(row) {
      var f = String(row[firstCol] || '').trim();
      var l = String(row[lastCol] || '').trim();
      if (f || l) sampleNames.push((f + ' ' + l).trim());
    });
  } else if (nameCol !== null) {
    samples.forEach(function(row) {
      var val = String(row[nameCol] || '').trim();
      if (val) sampleNames.push(val);
    });
  }

  // Helper to escape HTML in header names
  function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // ---- AUTO-DETECT SUMMARY VIEW ----
  var summaryCard = document.createElement('div');
  summaryCard.className = 'cm-summary-card';
  summaryCard.id = 'cm-auto-summary';

  var cardTitle = document.createElement('div');
  cardTitle.className = 'cm-title';
  cardTitle.textContent = 'Contact File Summary';
  summaryCard.appendChild(cardTitle);

  // Contact count
  var countLine = document.createElement('div');
  countLine.className = 'cm-summary-count';
  countLine.innerHTML = '\u2713 We found <strong>' + totalRows + '</strong> contacts';
  summaryCard.appendChild(countLine);

  // Detected fields
  var fieldsList = document.createElement('div');
  fieldsList.className = 'cm-summary-fields';

  // Name field
  var nameLine = document.createElement('div');
  nameLine.className = 'cm-summary-field';
  if (hasSeparateCols) {
    nameLine.innerHTML = '<span class="cm-field-label">Name:</span> "' + escH(headers[firstCol]) + '" + "' + escH(headers[lastCol]) + '" columns (separate)';
    if (sampleNames.length) {
      var sampleSpan = document.createElement('span');
      sampleSpan.className = 'cm-sample-preview';
      sampleSpan.textContent = ' \u2014 ' + sampleNames.slice(0, 3).join(', ');
      nameLine.appendChild(sampleSpan);
    }
  } else if (nameCol !== null) {
    nameLine.innerHTML = '<span class="cm-field-label">Name:</span> "' + escH(headers[nameCol] || 'Column ' + nameCol) + '" column (' + (nameFormatLabel[nameFormat] || 'auto') + ')';
    if (sampleNames.length) {
      var sampleSpan2 = document.createElement('span');
      sampleSpan2.className = 'cm-sample-preview';
      sampleSpan2.textContent = ' \u2014 ' + sampleNames.slice(0, 3).join(', ');
      nameLine.appendChild(sampleSpan2);
    }
  } else {
    nameLine.innerHTML = '<span class="cm-field-warn">\u26A0</span> No name column found \u2014 contacts will be imported without names';
  }
  fieldsList.appendChild(nameLine);

  // Phone field
  var phoneLine = document.createElement('div');
  phoneLine.className = 'cm-summary-field';
  if (phoneCol !== null) {
    var phoneSamples = samples.map(function(row) { return String(row[phoneCol] || '').trim(); }).filter(Boolean);
    phoneLine.innerHTML = '<span class="cm-field-label">Phone:</span> "' + escH(headers[phoneCol] || 'Column ' + phoneCol) + '" column';
    if (phoneSamples.length) {
      var ps = document.createElement('span');
      ps.className = 'cm-sample-preview';
      ps.textContent = ' \u2014 ' + phoneSamples.slice(0, 2).join(', ');
      phoneLine.appendChild(ps);
    }
  } else {
    phoneLine.innerHTML = '<span class="cm-field-warn">\u26A0</span> No phone column found \u2014 please map manually';
  }
  fieldsList.appendChild(phoneLine);

  // Last Contacted (optional)
  if (lastContactedCol !== null) {
    var lcLine = document.createElement('div');
    lcLine.className = 'cm-summary-field';
    lcLine.innerHTML = '<span class="cm-field-label">Last Contacted:</span> "' + escH(headers[lastContactedCol]) + '" column <span class="cm-optional">(optional \u2014 used for sorting)</span>';
    fieldsList.appendChild(lcLine);
  }

  summaryCard.appendChild(fieldsList);

  // Action buttons
  var summaryActions = document.createElement('div');
  summaryActions.className = 'cm-actions';

  if (phoneCol !== null) {
    var blastBtn = document.createElement('button');
    blastBtn.className = 'btn';
    blastBtn.style.background = 'var(--green, #22c55e)';
    blastBtn.textContent = 'Yes, blast it';
    blastBtn.addEventListener('click', function() {
      hideColumnMapPanel();
      sendAction('confirm_auto', { columnMap: suggested });
    });
    summaryActions.appendChild(blastBtn);

    var exclBtn = document.createElement('button');
    exclBtn.className = 'btn ghost';
    exclBtn.textContent = 'Yes, with exclusion list';
    exclBtn.addEventListener('click', function() {
      hideColumnMapPanel();
      sendAction('confirm_column_map', { columnMap: suggested });
    });
    summaryActions.appendChild(exclBtn);
  }

  var fixBtn = document.createElement('button');
  fixBtn.className = 'btn ghost';
  fixBtn.textContent = 'No, let me fix it';
  fixBtn.addEventListener('click', function() {
    document.getElementById('cm-auto-summary').style.display = 'none';
    document.getElementById('cm-manual-mapper').style.display = 'block';
  });
  summaryActions.appendChild(fixBtn);

  var startOverBtn1 = document.createElement('button');
  startOverBtn1.className = 'btn text-link';
  startOverBtn1.textContent = 'Start Over';
  startOverBtn1.addEventListener('click', function() {
    hideColumnMapPanel();
    sendAction('start_over', {});
  });
  summaryActions.appendChild(startOverBtn1);

  summaryCard.appendChild(summaryActions);
  panel.appendChild(summaryCard);

  // ---- MANUAL MAPPER (hidden by default) ----
  var manualMapper = document.createElement('div');
  manualMapper.id = 'cm-manual-mapper';
  manualMapper.style.display = 'none';

  var manualTitle = document.createElement('div');
  manualTitle.className = 'cm-title';
  manualTitle.textContent = 'Map Your Columns';
  manualMapper.appendChild(manualTitle);

  // Name column picker
  var nameGroup = document.createElement('div');
  nameGroup.className = 'cm-field-group';

  var nameLabel = document.createElement('label');
  nameLabel.className = 'cm-field-label';
  nameLabel.id = 'cm-name-label';
  nameLabel.textContent = 'Which column has the name?';
  nameGroup.appendChild(nameLabel);

  var nameSel = document.createElement('select');
  nameSel.id = 'cm-manual-name';
  nameSel.className = 'cm-select';
  var noneOpt = document.createElement('option');
  noneOpt.value = '';
  noneOpt.textContent = '\u2014 None \u2014';
  nameSel.appendChild(noneOpt);
  headers.forEach(function(h, i) {
    var o = document.createElement('option');
    o.value = i;
    o.textContent = h || '(Column ' + (i + 1) + ')';
    if (nameCol !== null && i === nameCol) o.selected = true;
    nameSel.appendChild(o);
  });
  nameGroup.id = 'cm-name-group';
  nameGroup.appendChild(nameSel);

  // Name format radios
  var formatDiv = document.createElement('div');
  formatDiv.className = 'cm-format-group';
  formatDiv.id = 'cm-name-format-group';

  var formatLabel2 = document.createElement('span');
  formatLabel2.className = 'cm-field-label';
  formatLabel2.textContent = 'Name format: ';
  formatDiv.appendChild(formatLabel2);

  var formats = [{ val: 'name_fl', label: 'First Last' }, { val: 'name_lf', label: 'Last, First' }, { val: 'separate', label: 'Separate columns' }];
  formats.forEach(function(f) {
    var lbl = document.createElement('label');
    lbl.className = 'cm-radio-label';
    var radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'nameFormat';
    radio.value = f.val;
    if (hasSeparateCols && f.val === 'separate') radio.checked = true;
    else if (!hasSeparateCols && f.val === (nameFormat || 'name_fl')) radio.checked = true;
    radio.addEventListener('change', function() {
      document.getElementById('cm-separate-cols').style.display = this.value === 'separate' ? 'flex' : 'none';
      document.getElementById('cm-manual-name').style.display = this.value === 'separate' ? 'none' : 'block';
      document.getElementById('cm-name-label').style.display = this.value === 'separate' ? 'none' : 'block';

    var ic = data.importCounts;
    statParts.push('\u2014 ' + (ic.created || 0) + ' new, ' + (ic.updated || 0) + ' updated, ' + (ic.unchanged || 0) + ' unchanged');
  }
  stat.innerHTML = statParts.join(' ');

  if (data.exclusionFileName || data.excludedCount > 0 || data.exclusionTotal > 0) {
    var exclStat = document.createElement('div');
    exclStat.className = 'bf-stat';
    if (data.exclusionFileName) {
      exclStat.innerHTML = '\ud83d\udcdd Exclusion list: <strong>' + esc(data.exclusionFileName) + '</strong> (' + (data.exclusionTotal || 0) + ' ' + ((data.exclusionTotal || 0) === 1 ? 'number' : 'numbers') + ', ' + (data.excludedCount || 0) + ' ' + ((data.excludedCount || 0) === 1 ? 'contact' : 'contacts') + ' removed)';

  if (data.estimatedSendable !== undefined) {
    var guardStat = document.createElement('div');
    guardStat.className = 'bf-stat';
    var excluded = (data.estimatedCooldown || 0) + (data.estimatedDnc || 0);
    if (excluded > 0) {
      var parts = [];

function updateTemplatePreview() {
  var body = document.getElementById('blastTemplateBody');
  var preview = document.getElementById('blastTemplatePreview');
  if (!body || !preview) return;
  var expanded = body.value
    .replace(/\{first_name\}/g, 'John')
    .replace(/\{link\}/g, 'https://m.whippy.co/xxxxxxxx');
  preview.textContent = expanded;
  updateCreditCounter(expanded);
}

function updateCreditCounter(expandedText) {
  var counter = document.getElementById('smsCreditCounter');
  if (!counter) return;
  var charCount = (expandedText || '').length;
  if (charCount === 0) {
    counter.textContent = '0 characters';
    counter.className = 'sms-credit-counter credit-green';
    return;
  }
  var credits = Math.ceil(charCount / 160);
  // Determine recipient count
  var modeRadio = document.querySelector('input[name="recipientMode"]:checked');
  var recipientMode = modeRadio ? modeRadio.value : 'all';
  var recipientCount = window._blastContactCount || 0;
  if (recipientMode === 'top') {
    var rcInput = document.getElementById('recipientCount');
    if (rcInput) recipientCount = Math.min(parseInt(rcInput.value) || 0, window._blastContactCount || 999999);
  }
  var totalCredits = credits * recipientCount;
  // Color coding
  var colorClass = 'credit-green';
  if (credits === 2) colorClass = 'credit-yellow';
  else if (credits >= 3) colorClass = 'credit-red';
  counter.className = 'sms-credit-counter ' + colorClass;
  counter.textContent = charCount + ' chars \u00B7 ' + credits + ' credit' + (credits !== 1 ? 's' : '') + '/msg \u00B7 ' + recipientCount + ' recipients = ' + totalCredits + ' total credits';
}

async function submitBlastForm() {
  var vals = getBlastFormValues();
  if (!vals.category) {
    toast('Select a category before previewing.');
    return;
  }
  if (!vals.templateBody.trim()) {
    toast('Template message cannot be empty.');
    return;
  }
  // Require number selection if multiple numbers are configured
  var numSelEl = document.getElementById('blastFromNumber');
  if (numSelEl && numSelEl.options.length > 2 && !vals.fromNumber) {
    toast('Select a sending number before previewing.');
    return;
  }
  // Disable all action buttons to prevent double-click
  document.querySelectorAll('.bf-actions button').forEach(function(b) { b.disabled = true; });
  window._lastBlastTemplateBody = vals.templateBody;
  var _counterEl = document.getElementById('smsCreditCounter');
  window._lastBlastCredits = _counterEl ? _counterEl.textContent : '';
  hideBlastForm();
  document.querySelector('.card').classList.remove('hide-chat');
  showLoading();
  var r = await api('/api/tom/message', { method: 'POST', body: { sessionId: session, action: 'preview_blast', payload: vals } });
  hideLoading();
  if (r.showColumnMap && r.keepForm) {
    showColumnMapPanel(columnMapData || r);
    if (r.text) toast(r.text);
    return;
  }
  if (r.showBlastForm && r.keepForm) {
    showBlastForm(blastFormData || r);
    if (r.text) toast(r.text);
    return;
  }
  handleReply(r);
}

function renderBlastCards(blasts, timezone) {
  var tz = timezone || 'America/Chicago';
  var container = document.createElement('div');
  (blasts || []).forEach(function(b) {
    var card = document.createElement('div');
    card.className = 'blast-card';
    var d = new Date(b.sent_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true, timeZone: tz });
    var bits = [b.sent_count + ' sent'];
    if (b.skipped_cooldown_count) bits.push(b.skipped_cooldown_count + ' skipped (cooldown)');
    if (b.skipped_dnc_count) bits.push(b.skipped_dnc_count + ' skipped (DNC)');
    if (b.failed_count) bits.push(b.failed_count + ' failed');
    bits.push(b.interested_count + ' interested');
    var header = document.createElement('div');
    header.className = 'bc-header';
    header.textContent = '#' + b.id + ' \u00B7 ' + d + ' \u00B7 ' + (b.category || '') + (b.sent_by ? ' \u00B7 by ' + b.sent_by : '');
    card.appendChild(header);
    var meta = document.createElement('div');
    meta.className = 'bc-meta';
    meta.textContent = bits.join(', ');
    card.appendChild(meta);
    card.addEventListener('click', async function() {
      var existing = card.querySelector('.blast-recipients');
      if (existing) { existing.remove(); return; }
      var data = await api('/api/blasts/' + b.id + '/recipients');
      if (!data || !data.recipients) return;
      var sec = document.createElement('div');
      sec.className = 'blast-recipients';
      var tbl = document.createElement('table');
      tbl.innerHTML = '<tr><th>Name</th><th>Phone</th><th>Status</th></tr>';
      data.recipients.forEach(function(r) {
        var row = document.createElement('tr');
        var td1 = document.createElement('td'); td1.textContent = (r.first_name || '') + ' ' + (r.last_name || '');
        var td2 = document.createElement('td'); td2.textContent = r.phone_display || r.phone;
        var td3 = document.createElement('td'); td3.textContent = r.status;
        row.appendChild(td1); row.appendChild(td2); row.appendChild(td3);
        tbl.appendChild(row);
      });
      sec.appendChild(tbl);
      var csvLink = document.createElement('a');
      csvLink.className = 'csv-link';
      csvLink.href = '/api/blasts/' + b.id + '/recipients/csv';
      csvLink.download = '';
      csvLink.textContent = 'Download CSV';
      sec.appendChild(csvLink);
      card.appendChild(sec);
    });
    container.appendChild(card);
  });
  return container;
}

    var first = row.querySelector('.contact-first').value.trim();
    var last = row.querySelector('.contact-last').value.trim();
    var phone = row.querySelector('.contact-phone').value.trim();
    if (!first && !last && !phone) return;
    if (!phone) { toast('Each contact needs a phone number.'); hasError = true; return; }
    var namePart = [first, last].filter(Boolean).join(' ');
    lines.push(namePart + ' ' + phone);
  });
  if (hasError) return;
  if (!lines.length) { toast('Add at least one contact with a phone number.'); return; }

  hideContactForm();
  var text = lines.join('\n');
  addMsg('me', lines.length + ' contact' + (lines.length === 1 ? '' : 's') + ' entered');
  showLoading();
  api('/api/tom/message', { method: 'POST', body: { sessionId: session, text: text } }).then(function(r) {
    hideLoading();
    handleReply(r);
  });
}

function cfStartOver() {
  if (session) sendAction('start_over', {});
  else if (currentPath) tryStartPath(currentPath);
}

function handleReply(r) {
  if (r.error) { addMsg('tom', r.text || r.error); return; }
  session = r.sessionId;

  // Show task cards again when conversation ends
  if (r.state === 'ask_another' || r.state === 'ended') {
    document.getElementById('paths').classList.remove('wizard-active');
    document.querySelector('.card').classList.remove('hide-chat');
  }

  // JO form
  if (r.showForm && r.draft) {
    showJOForm(r.draft, r.warnings || []);
    return;
  }

  // Contact form for blast path
  if (r.path === 'blast' && r.state === 'await_contacts') {
    showContactForm();
    return;
  }

  // Column mapping panel
  if (r.showColumnMap && !r.keepForm) {
    showColumnMapPanel(r);
    return;
  }

  // Exclusion column mapper
  if (r.showExclusionMap) {
    showExclusionMapPanel(r);
    return;
  }
  // Exclusion upload panel
  if (r.showExclusionUpload) {
    showExclusionPanel(r);
    return;
  }

  // Blast settings form
  if (r.showBlastForm && !r.keepForm) {
    showBlastForm(r);
    return;
  }

  // If we were on blast form and got a non-form reply, hide it
  if (blastFormActive && !r.showBlastForm) {
    hideBlastForm();
    /* composer stays hidden — Patch B */
  }

  addMsg('tom', r.text, r);

  // Render help topic buttons if present
  if (r.helpTopics && r.helpTopics.length) {
    var chat = document.getElementById('chat');
    var topicDiv = document.createElement('div');
    topicDiv.className = 'help-topics';
    r.helpTopics.forEach(function(t) {
      var btn = document.createElement('button');
      btn.textContent = t.label;
      btn.addEventListener('click', function() {
        sendAction('help_topic', { topic: t.key }, t.label);
      });
      topicDiv.appendChild(btn);
    });
    chat.appendChild(topicDiv);
    topicDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
}

async function startPath(path) {
  currentPath = path;
  // Hide chat for all paths except help
  if (path !== 'help') {
    document.querySelector('.card').classList.add('hide-chat');
  } else {
    document.querySelector('.card').classList.remove('hide-chat');
  }
  hideJOForm();
  hideJOModeTabs();
  if (blastFormActive) hideBlastForm();
  var cfp = document.getElementById("contact-form-panel"); if (cfp && cfp.classList.contains("active")) hideContactForm();
  document.querySelectorAll('.paths button').forEach(function(b) {
    b.classList.toggle('on', b.dataset.path === path);
  });
  document.getElementById('chat').innerHTML = '';
  document.getElementById('paths').classList.add('wizard-active');
  document.getElementById('composer').style.display = 'none';
  document.getElementById('input').placeholder = 'Type here\u2026';
  showLoading();
  var r = await api('/api/tom/start', { method: 'POST', body: { path: path } });
  hideLoading();
  if (path === 'job_order') {
    session = r.sessionId;
    showJOEntryPanel();
  }
  handleReply(r);
}

function tryStartPath(path) {
  session = null;
  startPath(path);
}

async function sendText() {
  var inputEl = document.getElementById('input');
  var text = inputEl.value.trim();
  if (!session) return;

  if (joFormActive) {
    inputEl.value = '';
    if (text) toast('Edit fields directly in the form above, or click Start Over to re-parse.');
    return;
  }

  if (blastFormActive) {
    inputEl.value = '';
    if (text) toast('Use the blast settings form above, then click Preview Blast.');
    return;
  }

  if (!text) return;
  inputEl.value = '';
  addMsg('me', text);
  showLoading();
  var r = await api('/api/tom/message', { method: 'POST', body: { sessionId: session, text: text } });
  hideLoading();
  handleReply(r);
}

async function sendAction(action, payload, label) {
  if (label) addMsg('me', label);
  showLoading();
  var r = await api('/api/tom/message', { method: 'POST', body: { sessionId: session, action: action, payload: payload } });
  hideLoading();
  handleReply(r);
}

async function uploadFile(file) {
  if (!file || !session) return;
  addMsg('me', '\uD83D\uDCCE ' + file.name);
  showLoading();
  var fd = new FormData();
  fd.append('sessionId', session);
  fd.append('file', file);
  var res = await fetch('/api/tom/upload', { method: 'POST', body: fd });
  hideLoading();
  handleReply(await res.json());
}

// ---- Drag and Drop ----
(function() {
  var dropOverlay = document.getElementById('dropOverlay');
  var dragCounter = 0;
  var mainEl = document.querySelector('main.page');

  mainEl.addEventListener('dragenter', function(e) { e.preventDefault(); dragCounter++; dropOverlay.classList.add('active'); });
  mainEl.addEventListener('dragover', function(e) { e.preventDefault(); e.stopPropagation(); });
  mainEl.addEventListener('dragleave', function(e) { e.preventDefault(); dragCounter--; if (dragCounter <= 0) { dragCounter = 0; dropOverlay.classList.remove('active'); } });
  dropOverlay.addEventListener('dragleave', function(e) { e.preventDefault(); dragCounter--; if (dragCounter <= 0) { dragCounter = 0; dropOverlay.classList.remove('active'); } });

  function handleDrop(e) {
    e.preventDefault(); e.stopPropagation();
    dropOverlay.classList.remove('active'); dragCounter = 0;
    var files = Array.from(e.dataTransfer.files || []);
    if (!files.length) return;
    var file = files[0];
    if (file.size > 5 * 1024 * 1024) { toast(file.name + ' is too large (max 5 MB).'); return; }
    if (!/\.(csv|tsv|txt|xlsx|xls|docx|doc)$/i.test(file.name)) { toast(file.name + ': unsupported format. Use .docx, .xlsx, .csv, or .txt'); return; }

    if (session) {
      uploadFile(file);
      return;
    }
    toast('Pick a task above first, then drop your file.');
  }

  dropOverlay.addEventListener('drop', handleDrop);
  mainEl.addEventListener('drop', handleDrop);
})();

// Wire up buttons
document.querySelectorAll('.paths button').forEach(function(b) { b.addEventListener('click', function() { tryStartPath(b.dataset.path); }); });
document.getElementById('send').addEventListener('click', sendText);
document.getElementById('input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
});
document.getElementById('attach').addEventListener('click', function() { document.getElementById('fileinput').click(); });
document.getElementById('fileinput').addEventListener('change', async function(e) {
  var file = e.target.files[0];
  if (!file) return;
  uploadFile(file);
  e.target.value = '';
});


// ---- Unified JO Entry Panel ----
var pasteMode = false;

function showJOEntryPanel() {
  var panel = document.getElementById('jo-entry-panel');
  panel.className = 'active';
  panel.innerHTML = '';
  document.getElementById('chat').style.display = 'none';
  document.getElementById('composer').style.display = 'none';

  var title = document.createElement('div');
  title.className = 'jo-entry-title';
  title.textContent = 'How would you like to create this job order?';
  panel.appendChild(title);

  var options = document.createElement('div');
  options.className = 'jo-entry-options';

  // --- Option 1: Upload file (most preferred) ---
  var uploadOpt = document.createElement('div');
  uploadOpt.className = 'jo-entry-option';
  var uploadLabel = document.createElement('div');
  uploadLabel.className = 'jo-entry-option-label';
  uploadLabel.innerHTML = '<span class="icon">📁</span> Upload a file';
  uploadOpt.appendChild(uploadLabel);
  var uploadBtn = document.createElement('button');
  uploadBtn.className = 'btn jo-entry-upload-btn';
  uploadBtn.textContent = 'Choose .docx or .txt file';
  var joFileInput = document.createElement('input');
  joFileInput.type = 'file';
  joFileInput.accept = '.docx,.doc,.txt';
  joFileInput.style.display = 'none';
  joFileInput.addEventListener('change', function(e) {
    var f = e.target.files[0];
    if (!f) return;
    hideJOEntryPanel();
    uploadFile(f);
    e.target.value = '';
  });
  uploadBtn.addEventListener('click', function() { joFileInput.click(); });
  uploadOpt.appendChild(uploadBtn);
  uploadOpt.appendChild(joFileInput);
  var uploadHint = document.createElement('div');
  uploadHint.className = 'jo-entry-upload-hint';
  uploadHint.textContent = 'Or drag and drop a file anywhere on this page.';
  uploadOpt.appendChild(uploadHint);
  options.appendChild(uploadOpt);

  // --- Divider ---
  var div1 = document.createElement('div');
  div1.className = 'jo-entry-divider';
  div1.textContent = 'or';
  options.appendChild(div1);

  // --- Option 2: Paste job posting ---
  var pasteOpt = document.createElement('div');
  pasteOpt.className = 'jo-entry-option jo-entry-paste';
  var pasteLabel = document.createElement('div');
  pasteLabel.className = 'jo-entry-option-label';
  pasteLabel.innerHTML = '<span class="icon">📋</span> Paste a job posting';
  pasteOpt.appendChild(pasteLabel);
  var pasteHint = document.createElement('div');
  pasteHint.className = 'paste-hint';
  pasteHint.textContent = 'Paste from any source — Express microsite, email, ATS, Indeed, or plain text. AI extracts all fields automatically.';
  pasteOpt.appendChild(pasteHint);
  var ta = document.createElement('textarea');
  ta.id = 'paste-textarea';
  ta.placeholder = 'Paste the full job posting text here...';
  pasteOpt.appendChild(ta);
  var parseBtn = document.createElement('button');
  parseBtn.className = 'btn';
  parseBtn.style.cssText = 'width:100%;padding:10px;';
  parseBtn.textContent = 'Parse Job Posting';
  parseBtn.addEventListener('click', function() { submitPastedText(); });
  pasteOpt.appendChild(parseBtn);
  options.appendChild(pasteOpt);

  // --- Divider ---
  var div2 = document.createElement('div');
  div2.className = 'jo-entry-divider';
  div2.textContent = 'or';
  options.appendChild(div2);

  // --- Option 3: Blank form ---
  var blankOpt = document.createElement('div');
  blankOpt.style.textAlign = 'center';
  var blankLink = document.createElement('button');
  blankLink.className = 'jo-entry-blank';
  blankLink.textContent = 'Start with a blank form';
  blankLink.addEventListener('click', function(e) {
    e.preventDefault();
    hideJOEntryPanel();
    sendAction('blank_form', {});
  });
  blankOpt.appendChild(blankLink);
  options.appendChild(blankOpt);

  panel.appendChild(options);
  setTimeout(function() { ta.focus(); }, 50);
}

function hideJOEntryPanel() {
  var panel = document.getElementById('jo-entry-panel');
  panel.className = '';
  panel.innerHTML = '';
  document.getElementById('chat').style.display = 'flex';
}

// Legacy aliases so existing code calling hideJOModeTabs still works
function showJOModeTabs() { showJOEntryPanel(); }
function hideJOModeTabs() { hideJOEntryPanel(); }

function showPastePanel() { /* no-op, handled by entry panel */ }
function hidePastePanel() { /* no-op, handled by entry panel */ }

async function submitPastedText() {
  var ta = document.getElementById('paste-textarea');
  if (!ta) return;
  var text = ta.value.trim();
  if (!text) { toast('Paste a job posting first.'); return; }
  if (text.length < 20) { toast('That seems too short — paste the full job posting.'); return; }

  if (!session) {
    showLoading();
    var startR = await api('/api/tom/start', { method: 'POST', body: { path: 'job_order' } });
    session = startR.sessionId;
    currentPath = 'job_order';
    hideLoading();
  }

  hideJOEntryPanel();

  addMsg('me', 'Pasted job posting (' + text.length + ' chars)');
  showLoading();
  var r = await api('/api/tom/message', { method: 'POST', body: { sessionId: session, text: text } });
  hideLoading();
  handleReply(r);
}

boot('tom').then(function() {
  var p = new URLSearchParams(location.search).get('path');
  if (p && ['job_order','blast','review','help'].includes(p)) {
    startPath(p);
    // Deep-link to a specific help topic if ?topic= is set
    var topic = new URLSearchParams(location.search).get('topic');
    if (p === 'help' && topic) {
      // Wait for help topics to render, then auto-click the matching topic
      setTimeout(function() {
        sendAction('help_topic', { topic: topic });
      }, 500);
    }
  }
});
</script>
