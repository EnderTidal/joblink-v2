<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobLink — Billing</title>
  <link rel="stylesheet" href="/app.css">
  <style>
    .billing-card {
      max-width: 480px; margin: 80px auto; padding: 40px;
      background: var(--card); border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08); text-align: center;
    }
    .billing-card h2 { margin: 0 0 12px; font-size: 1.5rem; }
    .billing-card p { color: var(--muted); line-height: 1.6; margin: 0 0 20px; }
    .billing-card .status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: .85rem; font-weight: 600; margin-bottom: 20px; }
    .billing-card .status.canceled { background: #fef2f2; color: #dc2626; }
    .billing-card .status.past_due { background: #fffbeb; color: #d97706; }
    .billing-card .status.trialing { background: #f0fdf4; color: #16a34a; }
    .billing-card .status.active { background: #f0fdf4; color: #16a34a; }
    .btn-primary { display: inline-block; background: #6172f7; color: #fff; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; font-size: 1rem; }
    .btn-primary:hover { background: #4f5dd6; }
    .btn-secondary { display: inline-block; background: transparent; color: #6172f7; padding: 10px 24px; border-radius: 8px; text-decoration: none; font-weight: 500; border: 1px solid #6172f7; margin-left: 8px; font-size: .95rem; }
    .contact { margin-top: 24px; font-size: .9rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="billing-card">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6172f7" stroke-width="1.5" style="margin-bottom:16px">
      <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
      <line x1="1" y1="10" x2="23" y2="10"></line>
    </svg>
    <h2>Subscription Required</h2>
    <div class="status" id="statusBadge">loading...</div>
    <p id="statusMsg">Checking your subscription status...</p>
    <div id="actions"></div>
    <div class="contact">
      Need help? Email <a href="mailto:joshuafriends@gmail.com">joshuafriends@gmail.com</a>
    </div>
  </div>
  <script>
    (async () => {
      try {
        const res = await fetch('/api/me');
        if (res.status === 401) { location.href = '/login.html'; return; }
        const me = await res.json();
        const org = { name: me.org_name, subscription_status: me.subscription_status, trial_end: me.trial_end };

        const badge = document.getElementById('statusBadge');
        const msg = document.getElementById('statusMsg');
        const actions = document.getElementById('actions');
        const status = org.subscription_status || 'unknown';

        badge.textContent = status.replace('_', ' ');
        badge.className = 'status ' + status;

        if (status === 'canceled') {
          msg.textContent = 'Your subscription has been canceled. To regain access, please contact us to reactivate your account.';
          actions.innerHTML = '<a class="btn-primary" href="mailto:joshuafriends@gmail.com?subject=Reactivate JobLink - ' + encodeURIComponent(org.name || '') + '">Contact Us to Reactivate</a>';
        } else if (status === 'past_due') {
          msg.textContent = 'Your payment is past due. Please update your payment method to avoid losing access.';
          actions.innerHTML = '<a class="btn-primary" href="mailto:joshuafriends@gmail.com?subject=Payment Update - ' + encodeURIComponent(org.name || '') + '">Contact Us</a>';
        } else if (status === 'trialing') {
          const end = org.trial_end ? new Date(org.trial_end) : null;
          if (end && end < new Date()) {
            msg.textContent = 'Your free trial ended on ' + end.toLocaleDateString() + '. Subscribe to continue using JobLink.';
            actions.innerHTML = '<a class="btn-primary" href="mailto:joshuafriends@gmail.com?subject=Subscribe - ' + encodeURIComponent(org.name || '') + '">Contact Us to Subscribe</a>';
          } else {
            msg.textContent = 'Your trial is active' + (end ? ' until ' + end.toLocaleDateString() : '') + '.';
            actions.innerHTML = '<a class="btn-primary" href="/dashboard.html">Go to Dashboard</a>';
          }
        } else if (status === 'active') {
          msg.textContent = 'Your subscription is active. You\'re all set!';
          actions.innerHTML = '<a class="btn-primary" href="/dashboard.html">Go to Dashboard</a>';
        } else {
          msg.textContent = 'Unable to determine your subscription status. Please contact support.';
          actions.innerHTML = '<a class="btn-primary" href="mailto:joshuafriends@gmail.com?subject=Billing Help - JobLink">Contact Support</a>';
        }
      } catch(e) {
        document.getElementById('statusMsg').textContent = 'Unable to load billing information. Please try again or contact support.';
      }
    })();
  </script>
</body>
</html>
