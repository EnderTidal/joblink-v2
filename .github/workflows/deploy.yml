name: CI/CD

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          STRIPE_SK: sk_test_dummy_for_ci
          SESSION_SECRET: ci-test-secret

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          PAYLOAD='{"ref":"refs/heads/master"}'
          SIG="sha256=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" -hex 2>/dev/null | sed 's/^.* //')"
          echo "Calling webhook..."
          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w '%{http_code}' -X POST http://187.124.230.128:3849/webhooks/deploy             -H 'Content-Type: application/json'             -H "X-Hub-Signature-256: $SIG"             -d "$PAYLOAD")
          echo "HTTP $HTTP_CODE"
          cat /tmp/resp.txt
          [ "$HTTP_CODE" = "200" ] || exit 1
