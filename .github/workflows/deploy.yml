name: CI/CD

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          STRIPE_SK: sk_test_dummy_for_ci
          SESSION_SECRET: ci-test-secret

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          echo "Deploying to staging..."
          ssh -i ~/.ssh/deploy_key root@"$HOST" "cd /root/joblink-v2-staging && git fetch origin && git reset --hard origin/master && npm ci --omit=dev && pm2 restart joblink-v2-staging"

          echo "Verifying staging..."
          STAGING_HEALTH=$(ssh -i ~/.ssh/deploy_key root@"$HOST" "curl -sf http://localhost:3850/health" || echo "FAIL")
          echo "Staging health: $STAGING_HEALTH"
          echo "$STAGING_HEALTH" | grep -q '"ok"' || { echo "Staging health check failed"; exit 1; }

          echo "Deploying to production..."
          ssh -i ~/.ssh/deploy_key root@"$HOST" "cd /root/joblink-v2 && git fetch origin && git reset --hard origin/master && npm ci --omit=dev && pm2 restart joblink-v2"

          echo "Verifying production..."
          PROD_HEALTH=$(ssh -i ~/.ssh/deploy_key root@"$HOST" "curl -sf http://localhost:3849/health" || echo "FAIL")
          echo "Production health: $PROD_HEALTH"
          echo "$PROD_HEALTH" | grep -q '"ok"' || { echo "Production health check failed"; exit 1; }

          echo "Deploy complete!"
